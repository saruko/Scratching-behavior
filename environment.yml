# Mouse Scratch Detection System — Anaconda 環境定義 (ローカル GPU 対応)
# =============================================================================
# 使用方法:
#   conda env create -f environment.yml
#   conda activate mouse-scratch
#
# PyTorch と DeepLabCut は、環境を作ったあと check_env.py が pip で入れる
# (GPU は cu128、GPU が無ければ CPU 版):
#   conda run -n mouse-scratch python check_env.py
#
# SLEAP を使用したい場合 (別環境として推奨):
#   conda create -y -n sleap -c sleap -c nvidia -c conda-forge sleap
#   conda activate sleap && sleap-track --help
# =============================================================================

name: mouse-scratch

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.14
  - pip

  # 科学計算コアライブラリ
  - numpy>=1.23
  - pandas>=2.0
  - h5py>=3.9

  - pip:
    # Web サーバー & API
    - fastapi>=0.111.0
    - uvicorn[standard]>=0.29.0
    - pydantic>=2.7.0

    # 画像処理 (headless版: GUI不要)
    - opencv-python-headless>=4.9.0

    # YOLOv8 姿勢推定エンジン (GPU自動利用)
    - ultralytics>=8.2.0

    # HTTP クライアント (ヘルスチェック用)
    - httpx>=0.27.0
